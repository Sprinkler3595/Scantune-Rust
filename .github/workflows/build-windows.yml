name: Build Windows installers

on:
  # Lancement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:
  # Publication automatique d'une release quand un tag v* est poussé (ex: v0.1.0)
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (MSI + NSIS)
        run: npm run tauri -- build --bundles msi nsis

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanTune-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload EXE (NSIS) artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanTune-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          generate_release_notes: true
