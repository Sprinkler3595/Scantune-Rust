name: Security audit

on:
  # Audit sur chaque pull request touchant les dépendances
  pull_request:
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security.yml'
  # Audit hebdomadaire (lundi 06:00 UTC) pour attraper les nouvelles CVE
  schedule:
    - cron: '0 6 * * 1'
  # Lancement manuel depuis l'onglet Actions
  workflow_dispatch:

jobs:
  # Audit des dépendances Rust contre la base RustSec
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit
        working-directory: src-tauri

  # Audit des dépendances npm
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    # Non bloquant pour l'instant : npm audit remonte souvent des faux positifs
    # transitifs sans correctif disponible. À passer en bloquant une fois la
    # base assainie.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run npm audit (high and above)
        run: npm audit --audit-level=high
